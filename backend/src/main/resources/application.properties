spring.application.name=backend
# Base de datos MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:corebar_db}
spring.datasource.username=${DB_USER:corebar}
spring.datasource.password=${DB_PASSWORD}

# Hibernate (JPA)
# update crea y ajusta las tablas solas. Si se prefiere, se puede cambiar a validate.
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# En Linux MySQL distingue mayúsculas en los nombres de tabla (Categorias, Usuarios...).
# Sin esta línea Hibernate los pasa a minúsculas y no encuentra las tablas.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# Puerto del servidor backend
server.port=8080

# CORS: orígenes permitidos separados por comas (por ejemplo http://localhost:5173)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# JWT (HS256): la clave debe tener al menos 32 bytes (variable APP_JWT_SECRET)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000


# Subida de archivos (máximo 10 MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI y Swagger UI bajo /api (/api y /api/ redirigen a swagger-ui.html)
springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.url=/api/openapi
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.packages-to-scan=com.corebar.backend.controller
springdoc.paths-to-match=/api/**

# Almacenamiento de imágenes en disco
app.upload.dir=${UPLOAD_DIR:/data/uploads}
app.upload.public-base-url=${UPLOAD_PUBLIC_BASE_URL}
