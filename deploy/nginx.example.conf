# Ejemplo de Nginx para la API (cambia el dominio). Certbot añade el HTTPS.
server {
    listen 80;
    server_name api.ejemplo.es;
    client_max_body_size 10m;

    # Fotos de los productos (la API las guarda en disco y Nginx las sirve)
    location /uploads/ {
        alias /srv/corebar/uploads/;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Webs estáticas (admin, cocina, landing): sirve la carpeta dist/ de cada una.
server {
    listen 80;
    server_name admin.ejemplo.es;
    root /var/www/corebar/admin;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
