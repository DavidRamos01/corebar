# Backend + base de datos de Corebar.
# Uso:  cp .env.example .env   (y rellena los valores)   →   docker compose up -d --build
name: corebar
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: corebar_db
      MYSQL_USER: corebar
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: corebar_db
      DB_USER: corebar
      DB_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      UPLOAD_DIR: /data/uploads
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL}
      TZ: Europe/Madrid
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Europe/Madrid"
    volumes:
      - ${UPLOADS_DIR:-./uploads}:/data/uploads
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db_data:
